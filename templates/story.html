<!-- STORY 1080x1920. Copie para posts/<data-slug>/pecas.html. Textos ficam fora das faixas seguras pelo padding do .rg-canvas--story. -->
<section class="rg-canvas rg-canvas--story" data-out="story">
<h1 class="rg-title rg-title--story">Bateu o <span class="rg-hl">ponto</span>.<br>Mas estava no <span class="rg-hl">posto</span>?</h1>
<p class="rg-sub">Com geofence, você sabe.</p>
<div class="rg-map" style="margin-top:72px;height:440px"><div class="rg-map__fence" style="width:320px;height:320px"></div><div class="rg-map__pin"></div></div>
<div class="rg-evid" style="grid-template-columns:1fr 1fr 1fr;margin-top:40px">
<div class="rg-card rg-card--hl"><div class="rg-card__label"><svg class="rg-icon" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Local</div><div class="rg-card__value rg-card__value--ok">No raio</div></div>
<div class="rg-card"><div class="rg-card__label"><svg class="rg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hora</div><div class="rg-card__value">06:58</div></div>
<div class="rg-card"><div class="rg-card__label"><svg class="rg-icon" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</div><div class="rg-card__value">Sim</div></div></div>
<div class="rg-foot" style="margin-top:auto"><p class="rg-closing">Ponto não é só horário. <span class="rg-hl">É evidência.</span></p><div class="rg-sign"><img class="rg-sign__mark" src="../../brand/logos/radar-ponto.png" alt=""><span><b>Radar Ponto</b> <i>•</i> Grupo Radar Sistemas</span></div></div>
</section>
</body></html>
