name: Gerar imagens
on:
  push:
    paths: ["pedidos/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: imagens
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar/baixar imagens
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 tools/gerar_imagens.py
      - name: Salvar no repositório
        run: |
          git config user.name "gruporadar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Imagens geradas"
          git pull --rebase origin main && git push origin HEAD:main
